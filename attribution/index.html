<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tirage au sort des projets audiovisuels MMI</title>
<style>
  :root {
    --bg: #0f1226;
    --panel: #1a1f3d;
    --panel2: #232950;
    --gold: #ffcb47;
    --pink: #ff5d8f;
    --cyan: #4fd1c5;
    --text: #f4f6ff;
    --muted: #9aa3c7;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    color: var(--text);
    background: radial-gradient(1200px 600px at 50% -10%, #2a3060 0%, var(--bg) 60%);
    min-height: 100vh;
  }
  header {
    text-align: center;
    padding: 28px 16px 10px;
  }
  header h1 {
    margin: 0;
    font-size: clamp(1.3rem, 3vw, 2rem);
    letter-spacing: .5px;
  }
  header p {
    margin: 6px 0 0;
    color: var(--muted);
    font-size: .95rem;
  }
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 16px 20px 60px;
  }
  .screen { display: none; }
  .screen.active { display: block; }

  /* ---------- Configuration ---------- */
  .config-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 18px;
  }
  .card {
    background: var(--panel);
    border: 1px solid #2e3564;
    border-radius: 14px;
    padding: 18px;
  }
  .card h2 {
    margin: 0 0 4px;
    font-size: 1.05rem;
    color: var(--gold);
  }
  .card .hint {
    margin: 0 0 12px;
    font-size: .85rem;
    color: var(--muted);
  }
  .row-input {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel2);
    border: 1px solid #333b70;
    border-radius: 9px;
    padding: 6px 10px;
    margin-bottom: 8px;
  }
  .row-input label {
    min-width: 64px;
    font-size: .8rem;
    color: var(--muted);
    font-weight: 600;
  }
  .row-input input {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: .95rem;
    padding: 6px 0;
  }
  button {
    font-family: inherit;
    border: none;
    cursor: pointer;
    border-radius: 10px;
    font-weight: 700;
  }
  .btn-primary {
    display: block;
    margin: 22px auto 0;
    background: linear-gradient(135deg, var(--gold), #ff9e2c);
    color: #14204a;
    font-size: 1.05rem;
    padding: 14px 34px;
    box-shadow: 0 8px 22px rgba(255, 190, 60, .35);
  }
  .btn-primary:hover { filter: brightness(1.06); }
  .btn-ghost {
    background: var(--panel2);
    color: var(--text);
    border: 1px solid #333b70;
    font-size: .85rem;
    padding: 9px 16px;
  }
  .btn-ghost:hover { border-color: var(--cyan); color: var(--cyan); }

  /* ---------- Écran tirage ---------- */
  .stage-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  #current-team {
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--cyan);
  }
  #progress-dots { display: flex; gap: 7px; }
  #progress-dots span {
    width: 13px; height: 13px;
    border-radius: 50%;
    background: #333b70;
  }
  #progress-dots span.done { background: var(--gold); }
  #progress-dots span.now { background: var(--pink); box-shadow: 0 0 0 4px rgba(255, 93, 143, .25); }

  .machine {
    position: relative;
    background: linear-gradient(180deg, #2b3168, #1a1f3d);
    border: 1px solid #3a4283;
    border-radius: 20px;
    padding: 28px 22px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, .45);
    overflow: hidden;
  }
  .machine::before {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(135deg, rgba(255,255,255,.03) 0 2px, transparent 2px 14px);
    pointer-events: none;
  }
  .reels {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }
  .reel {
    position: relative;
    height: 150px;
    background: #0d1030;
    border: 2px solid #454d96;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 10px;
    overflow: hidden;
  }
  .reel::after { /* reflets de vitrine */
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(255,255,255,.08), transparent 30%, transparent 70%, rgba(0,0,0,.35));
    pointer-events: none;
  }
  .reel .value {
    font-weight: 800;
    font-size: clamp(.95rem, 2.2vw, 1.35rem);
    line-height: 1.25;
    word-break: break-word;
  }
  .reel .value img {
    max-height: 92px;
    max-width: 100%;
    object-fit: contain;
    display: block;
    margin: 0 auto 6px;
    filter: drop-shadow(0 6px 14px rgba(0, 0, 0, .55));
  }
  .reel .value .caption {
    font-size: .72rem;
    color: var(--muted);
    font-weight: 600;
    line-height: 1.2;
  }
  .reel.spinning .value {
    filter: blur(1.6px);
    opacity: .85;
  }
  .reel.settled .value { animation: pop .45s ease; }
  @keyframes pop {
    0% { transform: scale(1.25); }
    60% { transform: scale(.95); }
    100% { transform: scale(1); }
  }
  .bulbs {
    position: absolute;
    top: 10px; left: 10px; right: 10px;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
  }
  .bulbs i {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--gold);
    opacity: .25;
  }
  .machine.lit .bulbs i { animation: blink .7s infinite alternate; }
  @keyframes blink { from { opacity: .2; } to { opacity: 1; } }

  .draw-controls { text-align: center; margin-top: 24px; }
  .sound-toggle { margin-top: 12px; }
  #spin-btn {
    background: linear-gradient(135deg, var(--pink), #b437ff);
    color: #fff;
    font-size: 1.1rem;
    letter-spacing: 1px;
    padding: 16px 44px;
    box-shadow: 0 10px 26px rgba(255, 93, 143, .4);
  }
  #spin-btn:disabled { opacity: .4; cursor: not-allowed; }

  #result-band {
    margin-top: 24px;
    padding: 18px;
    border-radius: 14px;
    background: rgba(79, 209, 197, .12);
    border: 1px solid rgba(79, 209, 197, .5);
    text-align: center;
    display: none;
  }
  #result-band.show { display: block; animation: pop .5s ease; }
  #result-band .who { color: var(--cyan); font-weight: 700; }
  #result-band .gets { color: var(--gold); font-weight: 800; font-size: 1.2rem; }
  .gets-logo {
    max-height: 44px;
    vertical-align: middle;
    margin-right: 10px;
  }

  .confetti {
    position: fixed;
    top: -12px;
    width: 9px; height: 14px;
    z-index: 50;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(105vh) rotate(720deg); opacity: .2; }
  }

  /* ---------- Résultats ---------- */
  .results-block { margin-top: 30px; }
  .results-block h2 { color: var(--gold); font-size: 1.05rem; }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--panel);
    border-radius: 12px;
    overflow: hidden;
    font-size: .93rem;
  }
  th, td {
    text-align: left;
    padding: 10px 14px;
    border-bottom: 1px solid #2e3564;
  }
  th { color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .8px; }
  tr:last-child td { border-bottom: none; }
  td.assigned { color: var(--gold); font-weight: 700; }
  .toolbar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 14px;
  }
  #toast {
    position: fixed;
    bottom: 26px; left: 50%;
    transform: translateX(-50%);
    background: var(--cyan);
    color: #06231f;
    font-weight: 700;
    padding: 10px 20px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s;
    z-index: 60;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>🎰 Tirage au sort des projets audiovisuels</h1>
  <p>BUT MMI 2e année × Village by CA Rouen Vallée de Seine &mdash; 8 équipes, 8 commanditaires</p>
</header>

<main>
  <!-- ÉCRAN 1 : configuration -->
  <section id="screen-config" class="screen active">
    <div class="config-grid">
      <div class="card">
        <h2>🧑‍🤝‍🧑 Équipes</h2>
        <p class="hint">Modifiez les noms des 8 équipes.</p>
        <div id="team-inputs"></div>
      </div>
      <div class="card">
        <h2>🏢 Commanditaires</h2>
        <p class="hint">Saisissez les 8 entreprises / projets du Village by CA.</p>
        <div id="project-inputs"></div>
      </div>
    </div>
    <button id="start-btn" class="btn-primary">Commencer le tirage</button>
  </section>

  <!-- ÉCRAN 2 : tirage -->
  <section id="screen-draw" class="screen">
    <div class="stage-top">
      <div id="current-team"></div>
      <div id="progress-dots"></div>
      <button id="back-btn" class="btn-ghost">⚙️ Config</button>
    </div>

    <div class="machine" id="machine">
      <div class="bulbs"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="reels">
        <div class="reel" id="reel-0"><div class="value">?</div></div>
        <div class="reel" id="reel-1"><div class="value">?</div></div>
        <div class="reel" id="reel-2"><div class="value">?</div></div>
      </div>
    </div>

    <div class="draw-controls">
      <button id="spin-btn">LANCER LE TIRAGE</button>
      <button id="sound-btn" class="btn-ghost sound-toggle">🔊 Son activé</button>
    </div>

    <div id="result-band"></div>

    <div class="results-block">
      <h2>📋 Résultats</h2>
      <table>
        <thead>
          <tr><th>Équipe</th><th>Projet attribué</th></tr>
        </thead>
        <tbody id="results-body"></tbody>
      </table>
      <div class="toolbar">
        <button id="export-btn" class="btn-ghost">⤓ Exporter en JSON</button>
        <button id="copy-btn" class="btn-ghost">⧉ Copier le JSON</button>
        <button id="reset-btn" class="btn-ghost">↺ Réinitialiser</button>
      </div>
    </div>
  </section>
</main>

<div id="toast"></div>

<script>
(function () {
  "use strict";

  var STORE_KEY = "tirage-projets-mmi-v2";
  var NB = 8;  // nombre d'équipes / projets
  var LOGO_DIR = "logos/";

  var commanditaires = [
    { name: "Le Village by CA Rouen Vallée de Seine", logo: "village_by_CA.png" },
    { name: "FIDAL Avocats", logo: "fidal.png" },
    { name: "Normandie Energies", logo: "normandie_energies.png" },
    { name: "Le groupe La Poste", logo: "la_poste.png" },
    { name: "CANDOR", logo: "candor.png" },
    { name: "HomeDoc", logo: "homedoc.png" },
    { name: "bulbup", logo: "bulbup.png" },
    { name: "MALO", logo: "malo.png" }
  ];

  var logoOk = {};   // nom de fichier -> true si chargé, false si introuvable

  var state = load() || defaultState();

  function defaultState() {
    var teams = [], projects = [];
    for (var i = 1; i <= NB; i++) {
      var src = commanditaires[i - 1] || {};
      teams.push({ id: i, name: "Équipe " + i });
      projects.push({ id: i, name: src.name || ("Commanditaire " + i), logo: src.logo || null });
    }
    return {
      teams: teams,
      projects: projects,
      assignment: {},   // id équipe -> objet projet
      next: 0           // index de la prochaine équipe à tirer
    };
  }

  /* Rattache un logo aux projets sauvegardés avant l'ajout des logos */
  (function migrate(state) {
    if (!state || !state.projects) return;
    state.projects.forEach(function (p) {
      if (p.logo) return;
      for (var j = 0; j < commanditaires.length; j++) {
        if (commanditaires[j].name === p.name) { p.logo = commanditaires[j].logo; break; }
      }
    });
  })(state);

  /* Détecte quels fichiers de logo existent vraiment */
  commanditaires.forEach(function (c) {
    if (!c.logo || logoOk[c.logo] !== undefined) return;
    (function (file) {
      var probe = new Image();
      probe.onload = function () { logoOk[file] = true; };
      probe.onerror = function () { logoOk[file] = false; };
      probe.src = LOGO_DIR + file;
    })(c.logo);
  });

  /* Remplit une case de la machine : logo + nom, ou juste le nom si le logo manque */
  function setSlot(valueEl, project) {
    valueEl.innerHTML = "";
    var file = project && project.logo;
    if (file && logoOk[file]) {
      var img = document.createElement("img");
      img.src = LOGO_DIR + file;
      img.alt = project.name;
      valueEl.appendChild(img);
      var cap = document.createElement("div");
      cap.className = "caption";
      cap.textContent = project.name;
      valueEl.appendChild(cap);
    } else {
      valueEl.textContent = project ? project.name : "?";
    }
  }

  /* ---------- Audio (Web Audio API, aucun fichier à fournir) ---------- */
  var audioCtx = null;
  var soundOn = true;

  function ensureAudio() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!audioCtx) {
      try { audioCtx = new AC(); } catch (e) { return null; }
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }

  /* Clic mécanique pendant le défilement des rouleaux */
  function playTick() {
    if (!soundOn) return;
    var ctx = ensureAudio();
    if (!ctx) return;
    var o = ctx.createOscillator();
    var g = ctx.createGain();
    o.type = "square";
    o.frequency.value = 720 + Math.random() * 260;
    g.gain.setValueAtTime(0.035, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.06);
    o.connect(g);
    g.connect(ctx.destination);
    o.start();
    o.stop(ctx.currentTime + 0.07);
  }

  /* "Clac" à l'arrêt d'un rouleau */
  function playReelStop() {
    if (!soundOn) return;
    var ctx = ensureAudio();
    if (!ctx) return;
    var t = ctx.currentTime;
    var o = ctx.createOscillator();
    var g = ctx.createGain();
    o.type = "square";
    o.frequency.setValueAtTime(240, t);
    o.frequency.exponentialRampToValueAtTime(120, t + 0.12);
    g.gain.setValueAtTime(0.12, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    o.connect(g);
    g.connect(ctx.destination);
    o.start(t);
    o.stop(t + 0.2);
  }

  /* Petit arpège de fanfare quand le projet est révélé */
  function playFanfare() {
    if (!soundOn) return;
    var ctx = ensureAudio();
    if (!ctx) return;
    var notes = [523.25, 659.25, 783.99, 1046.5];  // C5 E5 G5 C6
    notes.forEach(function (freq, i) {
      var t = ctx.currentTime + i * 0.12;
      var o = ctx.createOscillator();
      var g = ctx.createGain();
      o.type = "triangle";
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.12, t + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);
      o.connect(g);
      g.connect(ctx.destination);
      o.start(t);
      o.stop(t + 0.45);
    });
  }

  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  /* ---------- Écran configuration ---------- */
  function buildInputs() {
    var tHost = document.getElementById("team-inputs");
    var pHost = document.getElementById("project-inputs");
    tHost.innerHTML = "";
    pHost.innerHTML = "";
    state.teams.forEach(function (team) {
      var row = document.createElement("div");
      row.className = "row-input";
      var lab = document.createElement("label");
      lab.textContent = "Équipe " + team.id;
      var inp = document.createElement("input");
      inp.type = "text";
      inp.value = team.name;
      inp.addEventListener("input", function () {
        team.name = inp.value.trim() || ("Équipe " + team.id);
        save();
      });
      row.appendChild(lab);
      row.appendChild(inp);
      tHost.appendChild(row);
    });
    state.projects.forEach(function (project) {
      var row = document.createElement("div");
      row.className = "row-input";
      var lab = document.createElement("label");
      lab.textContent = "N° " + project.id;
      var inp = document.createElement("input");
      inp.type = "text";
      inp.value = project.name;
      inp.addEventListener("input", function () {
        project.name = inp.value.trim() || ("Commanditaire " + project.id);
        save();
      });
      row.appendChild(lab);
      row.appendChild(inp);
      pHost.appendChild(row);
    });
  }

  /* ---------- Navigation ---------- */
  function show(screenId) {
    ["screen-config", "screen-draw"].forEach(function (id) {
      document.getElementById(id).classList.toggle("active", id === screenId);
    });
  }

  /* ---------- Écran tirage ---------- */
  function remainingProjects() {
    var used = {};
    Object.keys(state.assignment).forEach(function (k) { used[state.assignment[k].id] = true; });
    return state.projects.filter(function (p) { return !used[p.id]; });
  }

  function renderProgress() {
    var host = document.getElementById("progress-dots");
    host.innerHTML = "";
    for (var i = 0; i < NB; i++) {
      var dot = document.createElement("span");
      if (i < state.next) dot.className = "done";
      else if (i === state.next) dot.className = "now";
      host.appendChild(dot);
    }
    var cur = state.teams[state.next];
    document.getElementById("current-team").textContent =
      state.next >= NB ? "Tirage terminé 🎉" : ("Au tour de : " + cur.name);
    document.getElementById("spin-btn").disabled = state.next >= NB;
  }

  function renderResults() {
    var body = document.getElementById("results-body");
    body.innerHTML = "";
    for (var i = 0; i < NB; i++) {
      var team = state.teams[i];
      var asg = state.assignment[team.id];
      var tr = document.createElement("tr");
      var td1 = document.createElement("td");
      td1.textContent = team.name;
      var td2 = document.createElement("td");
      if (asg) {
        td2.className = "assigned";
        td2.textContent = asg.name;
      } else {
        td2.textContent = "—";
        td2.style.color = "var(--muted)";
      }
      tr.appendChild(td1);
      tr.appendChild(td2);
      body.appendChild(tr);
    }
  }

  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._h);
    t._h = setTimeout(function () { t.classList.remove("show"); }, 2200);
  }

  function confetti() {
    var colors = ["#ffcb47", "#ff5d8f", "#4fd1c5", "#b437ff", "#ffffff"];
    for (var i = 0; i < 36; i++) {
      var c = document.createElement("div");
      c.className = "confetti";
      c.style.left = Math.random() * 100 + "vw";
      c.style.background = colors[i % colors.length];
      c.style.animationDuration = (1.4 + Math.random() * 1.4) + "s";
      c.style.animationDelay = (Math.random() * .4) + "s";
      document.body.appendChild(c);
      (function (el) {
        setTimeout(function () { el.remove(); }, 3400);
      })(c);
    }
  }

  function spinOnce() {
    if (state.next >= NB) { toast("Toutes les équipes ont leur projet 🎉"); return; }
    var pool = remainingProjects();
    if (!pool.length) { toast("Plus aucun projet disponible."); return; }

    var assigned = pool[Math.floor(Math.random() * pool.length)];
    var team = state.teams[state.next];
    var machine = document.getElementById("machine");
    var btn = document.getElementById("spin-btn");

    btn.disabled = true;
    machine.classList.add("lit");
    document.getElementById("result-band").classList.remove("show");

    var durations = [2100, 2750, 3400];
    var reels = [0, 1, 2].map(function (idx) {
      return document.getElementById("reel-" + idx);
    });
    var spinPool = state.projects;

    reels.forEach(function (reel, idx) {
      var valueEl = reel.querySelector(".value");
      reel.classList.remove("settled");
      reel.classList.add("spinning");
      var endAt = Date.now() + durations[idx];
      var timer = setInterval(function () {
        if (Date.now() >= endAt) {
          clearInterval(timer);
          reel.classList.remove("spinning");
          reel.classList.add("settled");
          setSlot(valueEl, assigned);
          playReelStop();
          if (idx === 2) finish();
          return;
        }
        setSlot(valueEl, spinPool[Math.floor(Math.random() * spinPool.length)]);
        playTick();
      }, 75 + idx * 12);
    });

    function finish() {
      state.assignment[team.id] = assigned;
      state.next += 1;
      save();
      machine.classList.remove("lit");

      var band = document.getElementById("result-band");
      band.innerHTML =
        '<div><span class="who"></span> reçoit le projet de <span class="gets"></span></div>';
      band.querySelector(".who").textContent = team.name;
      var getsEl = band.querySelector(".gets");
      getsEl.innerHTML = "";
      if (assigned.logo && logoOk[assigned.logo]) {
        var gimg = document.createElement("img");
        gimg.className = "gets-logo";
        gimg.src = LOGO_DIR + assigned.logo;
        gimg.alt = assigned.name;
        getsEl.appendChild(gimg);
      }
      var gtxt = document.createElement("span");
      gtxt.textContent = assigned.name;
      getsEl.appendChild(gtxt);
      band.classList.add("show");

      playFanfare();
      confetti();
      renderProgress();
      renderResults();

      if (state.next >= NB) {
        btn.textContent = "TIRAGE TERMINÉ 🎉";
        toast("Toutes les équipes ont leur projet 🎉");
      } else {
        btn.textContent = "LANCER LE TIRAGE";
        btn.disabled = false;
      }
    }
  }

  /* ---------- Export ---------- */
  function exportJson() {
    var data = state.teams.map(function (t) {
      return { equipe: t.name, projet: state.assignment[t.id] ? state.assignment[t.id].name : null };
    });
    var meta = {
      date: new Date().toISOString(),
      contexte: "Tirage projets audiovisuels - BUT MMI 2e année x Village by CA Rouen Vallée de Seine"
    };
    return JSON.stringify({ meta: meta, attributions: data }, null, 2);
  }

  function copyJson() {
    var text = exportJson();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text)
        .then(function () { toast("JSON copié ✓"); })
        .catch(function () { toast("Copie impossible, utilisez Exporter."); });
    } else {
      toast("Copie impossible, utilisez Exporter.");
    }
  }

  function downloadJson() {
    try {
      var blob = new Blob([exportJson()], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "tirage-projets-mmi.json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
      toast("Export lancé ✓");
    } catch (e) {
      toast("Export indisponible, utilisez Copier.");
    }
  }

  /* ---------- Événements ---------- */
  document.getElementById("start-btn").addEventListener("click", function () {
    var spinBtn = document.getElementById("spin-btn");
    spinBtn.textContent = "LANCER LE TIRAGE";
    spinBtn.disabled = state.next >= NB;
    document.getElementById("result-band").classList.remove("show");
    for (var r = 0; r < 3; r++) {
      var reel = document.getElementById("reel-" + r);
      reel.classList.remove("spinning", "settled");
      reel.querySelector(".value").textContent = "?";
    }
    renderProgress();
    renderResults();
    show("screen-draw");
  });
  document.getElementById("back-btn").addEventListener("click", function () {
    buildInputs();
    show("screen-config");
  });
  document.getElementById("spin-btn").addEventListener("click", spinOnce);
  var soundBtn = document.getElementById("sound-btn");
  soundBtn.addEventListener("click", function () {
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? "🔊 Son activé" : "🔇 Son coupé";
    if (soundOn) { ensureAudio(); playTick(); }
  });
  document.getElementById("export-btn").addEventListener("click", downloadJson);
  document.getElementById("copy-btn").addEventListener("click", copyJson);
  document.getElementById("reset-btn").addEventListener("click", function () {
    if (confirm("Réinitialiser le tirage, les noms d'équipes et de commanditaires ?")) {
      state = defaultState();
      save();
      buildInputs();
      show("screen-config");
    }
  });
  document.addEventListener("keydown", function (e) {
    var drawScreen = document.getElementById("screen-draw");
    if (e.code === "Space" && drawScreen.classList.contains("active") &&
        e.target.tagName !== "INPUT") {
      e.preventDefault();
      spinOnce();
    }
  });

  /* ---------- Démarrage ---------- */
  buildInputs();
  renderProgress();
  renderResults();
})();
</script>
</body>
</html>
